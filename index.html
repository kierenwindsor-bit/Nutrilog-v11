<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NutriLog">
<meta name="theme-color" content="#0a0f1c">
<title>NutriLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1c;--card:#151e30;--card2:#1c2842;--line:#26334f;--teal:#00d4aa;--amber:#fbbf24;--red:#f87171;--purple:#a78bfa;--text:#e8f0fe;--mute:#8da0c0;--sans:'Outfit',-apple-system,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:560px;margin:0 auto}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 28px;padding-top:calc(14px + env(safe-area-inset-top))}
#nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:13px 4px;background:none;border:0;color:var(--mute);font:600 14px var(--sans)}
#nav button.on{color:var(--teal);box-shadow:inset 0 2px 0 var(--teal)}
button{font-family:var(--sans);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.h b{font-size:16px}
.mono{font-family:var(--mono)}
.sm{font-size:12px;color:var(--mute)}
.note{font-size:12px;color:var(--mute);margin-top:3px}
h1{font-size:20px;margin:0 0 4px}
.bar{margin-bottom:11px}
.bt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bg{height:9px;background:var(--card2);border-radius:5px;overflow:hidden}
.bg i{display:block;height:100%;border-radius:5px}
.alert{padding:8px 10px;border-radius:9px;margin-top:6px;font-size:13px;line-height:1.35}
.alert.warn{background:rgba(248,113,113,.12);border-left:3px solid var(--red)}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dnav .dl2{flex:1;text-align:center;font-weight:600}
.dnav button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px}
.dnav button:disabled{opacity:.3}
.btn{background:var(--teal);color:#04241d;border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.full{width:100%}
.mini{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}
.mini.go{background:var(--teal);color:#04241d;border-color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:16px var(--sans)}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--mute);font:600 14px var(--mono)}
.seg button.on{background:var(--teal);color:#04241d;border-color:var(--teal)}
.seg.k button{font:600 12px var(--sans);padding:8px 2px}
.fb{padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:600;font-size:13px;line-height:1.25}
.fb span{display:block;font:400 11px var(--mono);color:var(--mute)}
.it{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.itm{flex:1;min-width:0}
.itm b{font-weight:600;font-size:14px;word-break:break-word}
.x{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mute);font-size:15px;flex:none}
.panel{background:var(--card2);border-radius:12px;padding:12px;margin-top:10px}
.sg{display:flex;justify-content:space-between;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:14px}
.sg span:first-child{flex:1}
#sug{background:var(--bg);border-radius:9px;margin-top:4px;max-height:260px;overflow-y:auto}
canvas{width:100%;height:150px;display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:#0f2a3a;border:1px solid var(--teal);color:var(--text);padding:10px 14px;border-radius:12px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
ul.p{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--mute);line-height:1.5}
#nav button{font-size:13px;padding:13px 2px}
.wr{display:grid;grid-template-columns:58px repeat(5,1fr);gap:4px;font-size:12px;padding:6px 0;border-top:1px solid var(--line);align-items:center}
.wr.hd{color:var(--mute);border-top:0}
.stp{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.stp .sn{flex:1;font-size:14px;min-width:0;word-break:break-word}
.stp .sq{min-width:64px;text-align:center;font-size:13px}
.pc .h{margin-bottom:4px}
.scan{display:none;position:fixed;inset:0;background:rgba(5,8,15,.92);z-index:20;overflow-y:auto;padding:16px}
.scan.open{display:block}
.scan-in{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.scan-vp{position:relative;width:100%;height:260px;background:#000;border-radius:10px;overflow:hidden}
.scan-vp video,.scan-vp canvas{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.scan-vp canvas.drawingBuffer{display:none}
</style>
</head>

/* ---------- store ---------- */
var store={};
function blank(date){return{date:date,weight:'',meals:{breakfast:[],lunch:[],snack:[],drink:[],dinner:[]},note:'',fluids:[],training:false,gut:[]};}
function norm(d,date){
  d=d&&typeof d==='object'?d:{};
  d.date=date;
  if(d.weight==null)d.weight='';
  if(!d.meals||typeof d.meals!=='object')d.meals={};
  SLOTS.forEach(function(s){
    var a=d.meals[s[0]];
    d.meals[s[0]]=Array.isArray(a)?a.filter(function(x){return x&&typeof x==='object';}):[];
    d.meals[s[0]].forEach(function(it){
      if(!it.id)it.id=uid();
      it.name=String(it.name==null?'':it.name);
      ['kcal','protein','fat','carbs'].forEach(function(k){var v=parseFloat(it[k]);it[k]=isFinite(v)?v:0;});
      ['fibre','satfat','sugar'].forEach(function(k){var v=parseFloat(it[k]);if(it[k]===''||it[k]==null||!isFinite(v))delete it[k];else it[k]=v;});
      delete it.test;
    });
  });
  d.fluids=Array.isArray(d.fluids)?d.fluids.filter(function(x){return x&&isFinite(parseFloat(x.ml));}):[];
  d.fluids.forEach(function(f){if(!f.id)f.id=uid();f.ml=parseFloat(f.ml);});
  d.gut=Array.isArray(d.gut)?d.gut.filter(function(x){return x&&typeof x==='object';}):[];
  d.gut.forEach(function(g){if(!g.id)g.id=uid();g.t=String(g.t||'');g.stool=(g.stool===''||g.stool==null||!isFinite(+g.stool))?'':+g.stool;['bloat','pain','wind'].forEach(function(k){var v=+g[k];g[k]=isFinite(v)&&v>=0&&v<=3?v:0;});g.notes=String(g.notes||'').slice(0,400);});
  d.training=!!d.training;
  if(typeof d.note!=='string')d.note='';
  return d;
}
function isEmpty(d){return !d.weight&&!d.note&&!d.training&&!d.fluids.length&&!d.gut.length&&SLOTS.every(function(s){return !d.meals[s[0]].length;});}
function save(){

}
function loadStore(){
  var raw=lsGet(K_DAYS,{});

}
function peek(date){return store[date]||blank(date);}

function loadHist(){var h=lsGet(K_HIST,[]);return Array.isArray(h)?h.filter(function(x){return x&&typeof x.name==='string'&&isFinite(parseFloat(x.kcal));}):[];}
function addHist(it){
  var h=loadHist().filter(function(x){return x.name.toLowerCase()!==it.name.toLowerCase();});
  var c={name:it.name,kcal:it.kcal,protein:it.protein,fat:it.fat,carbs:it.carbs};

/* ---------- calculations ---------- */
function items(d){var a=[];SLOTS.forEach(function(s){d.meals[s[0]].forEach(function(it){a.push(it);});});return a;}
function totals(d){
  var t={kcal:0,protein:0,fat:0,carbs:0,fibre:0,satfat:0,sugar:0,n:0,nFibre:0,nSat:0,nSugar:0,fluid:0};
  items(d).forEach(function(it){
    t.n++;t.kcal+=it.kcal;t.protein+=it.protein;t.fat+=it.fat;t.carbs+=it.carbs;
    if(it.fibre!==undefined){t.fibre+=it.fibre;t.nFibre++;}
    if(it.satfat!==undefined){t.satfat+=it.satfat;t.nSat++;}
    if(it.sugar!==undefined){t.sugar+=it.sugar;t.nSugar++;}
  });
  d.fluids.forEach(function(f){t.fluid+=f.ml;});
  return t;
}
function dayTargets(d){var T=Object.assign({},cfg.targets);if(d&&d.training)T.kcal+=TRAIN_BONUS;return T;}
function hasFood(date){var d=store[date];return !!(d&&items(d).length);}
function streakInfo(){
  var t=todayIso(),cur=0,start=hasFood(t)?t:addDays(t,-1),d=start;
  while(hasFood(d)){cur++;d=addDays(d,-1);}
  var keys=Object.keys(store).filter(hasFood).sort(),best=0,run=0,prev=null;
  keys.forEach(function(k){run=(prev&&addDays(prev,1)===k)?run+1:1;if(run>best)best=run;prev=k;});
  return{cur:cur,best:Math.max(best,cur)};
}

/* ---------- paste-in import ---------- */
var SLOT_ALIAS={breakfast:'breakfast',lunch:'lunch',snack:'snack',snacks:'snack',drink:'drink',drinks:'drink',dinner:'dinner'};
function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&iso(parse(d))===d;}
function parseImport(text,defDate){
  var ok=[],errors=[];
  String(text||'').split(/\r?\n/).forEach(function(raw,i){
    var ln=raw.trim(),L='Line '+(i+1)+': ';
    if(!ln||ln.charAt(0)==='#')return;
    var p=ln.split('|').map(function(x){return x.trim();}),date=defDate;
    if(/^\d{4}-\d{2}-\d{2}$/.test(p[0]))date=p.shift();
    if(!validDate(date)){errors.push(L+'date is not valid');return;}
    if(date>todayIso()){errors.push(L+'date is in the future');return;}
    var slot=SLOT_ALIAS[(p[0]||'').toLowerCase()];
    if(!slot){errors.push(L+'meal must be Breakfast, Lunch, Snack, Drink or Dinner');return;}
    var name=cleanName(p[1]||'');
    if(!name){errors.push(L+'name is missing');return;}
    var kcal=num(p[2]);
    if(kcal===undefined||kcal>5000){errors.push(L+'kcal is missing or not a sensible number');return;}
    for(var k=3;k<=8;k++){if(p[k]!==undefined&&p[k]!==''&&num(p[k])===undefined){errors.push(L+'field '+(k+1)+' is not a number');return;}}
    var it={id:uid(),name:name,kcal:kcal,protein:num(p[3])||0,fat:num(p[4])||0,carbs:num(p[5])||0,time:nowHM()};
    ['fibre','satfat','sugar'].forEach(function(f,j){var v=num(p[6+j]);if(v!==undefined)it[f]=v;});
    ok.push({date:date,slot:slot,it:it});
  });
  return{ok:ok,errors:errors};
}
function importHTML(){
  if(!importOpen)return '<button class="btn ghost full" style="margin-bottom:12px" data-act="importOpen">Paste entries</button>';
  var h='<div class="card"><div class="h"><b>Paste entries</b><span class="sm">one food per line</span></div>'+
    '<div class="sm">Meal | Name | Kcal | Protein | Fat | Carbs | Fibre | Sat fat | Sugars<br>Leave a value empty if unknown. Start a line with a date (2026-11-07 | ...) to log it on another day.</div>'+
    '<textarea id="imp_text" style="min-height:120px;margin-top:8px" placeholder="Snack | Crackers with two hummus | 314 | 6 | 17.6 | 31.5 | 2.9 | 1.6 | 4.6">'+esc(importText)+'</textarea>';
  importErrs.forEach(function(e){h+='<div class="alert warn">'+esc(e)+'</div>';});
  h+='<div class="row" style="margin-top:10px"><button class="btn" data-act="importRun">Add</button><button class="btn ghost" data-act="importCancel">Cancel</button></div></div>';
  return h;
}

function gutSummary(d){
  var s={n:d.gut.length,bl:0,pn:0,wd:0};
  d.gut.forEach(function(g){s.bl=Math.max(s.bl,+g.bloat||0);s.pn=Math.max(s.pn,+g.pain||0);s.wd=Math.max(s.wd,+g.wind||0);});
  return s;
}

/* ---------- CSV ---------- */
function csvCell(s){s=String(s==null?'':s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function buildCSV(mon){
  var T=cfg.targets,L=[],i,date,d,t;
  L.push('Week Starting,'+mon);
  L.push('Daily Targets,Kcal: '+T.kcal+' (+'+TRAIN_BONUS+' on training days),Protein: '+T.protein+'g,Fat: '+T.fat+'g,Carbs: '+T.carbs+'g,Fibre: '+T.fibre+'g,Sat fat limit: '+T.satfat+'g,Sugars limit: '+T.sugar+'g,Fluid: '+T.fluid+'ml');
  L.push('');
  L.push('Day,Date,Training Day,Weight (kg),Total Kcal,Total Protein (g),Total Fat (g),Total Carbs (g),Fibre (g),Sat Fat (g),Sugars (g),Fluid (ml),Kcal Target,vs Kcal Target,vs Protein Target,Entries with fibre data,Entries with sat fat data,Entries with sugars data,Entries');
  for(i=0;i<7;i++){
    date=addDays(mon,i);d=peek(date);t=totals(d);var DT=dayTargets(d);
    L.push([DAYN[i],date,d.training?'Yes':'',d.weight||'',t.n?Math.round(t.kcal):'',t.n?r1(t.protein):'',t.n?r1(t.fat):'',t.n?r1(t.carbs):'',
      t.nFibre?r1(t.fibre):'',t.nSat?r1(t.satfat):'',t.nSugar?r1(t.sugar):'',t.fluid?Math.round(t.fluid):'',
      Math.round(DT.kcal),t.n?Math.round(t.kcal-DT.kcal):'',t.n?r1(t.protein-DT.protein):'',t.n?t.nFibre:'',t.n?t.nSat:'',t.n?t.nSugar:'',t.n].join(','));
  }
  L.push('');L.push('DETAILED MEAL LOG');
  L.push('Day,Date,Meal Slot,Time,Description,Kcal,Protein (g),Fat (g),Carbs (g),Fibre (g),Sat Fat (g),Sugars (g)');
  for(i=0;i<7;i++){
    date=addDays(mon,i);d=peek(date);var any=false;
    SLOTS.forEach(function(s){d.meals[s[0]].forEach(function(it){
      any=true;
      L.push([DAYN[i],date,s[1],it.time||'',csvCell(it.name),Math.round(it.kcal),r1(it.protein),r1(it.fat),r1(it.carbs),
        it.fibre===undefined?'':r1(it.fibre),it.satfat===undefined?'':r1(it.satfat),it.sugar===undefined?'':r1(it.sugar)].join(','));
    });});
    if(!any)L.push([DAYN[i],date,'','','','','','','','','',''].join(','));
  }
  L.push('');L.push('FLUID LOG');
  L.push('Day,Date,Time,Type,Container,Amount (ml)');
  for(i=0;i<7;i++){
    date=addDays(mon,i);d=peek(date);
    var fl=d.fluids.slice().sort(function(a,b){return String(a.t).localeCompare(String(b.t));});
    fl.forEach(function(f){L.push([DAYN[i],date,f.t||'',KIND_LABEL[f.kind]||f.kind||'',CONT_LABEL[f.cont]||f.cont||'',Math.round(f.ml)].join(','));});
  }
  L.push('');L.push('JOURNAL');
  L.push('Day,Date,Time,Stool (Bristol 1-7),Bloating (0-3),Pain (0-3),Wind (0-3),Notes');
  for(i=0;i<7;i++){
    date=addDays(mon,i);d=peek(date);
    var gl=d.gut.slice().sort(function(a,b){return String(a.t).localeCompare(String(b.t));});
    gl.forEach(function(g){L.push([DAYN[i],date,g.t||'',g.stool===''?'':g.stool,g.bloat,g.pain,g.wind,csvCell(g.notes||'')].join(','));});
  }
  return L.join('\n')+'\n';
}
function download(name,text,type){
  var data=type==='text/csv'?'\ufeff'+text:text;
  var blob=new Blob([data],{type:type});
  try{
    var standalone=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
    if(standalone&&navigator.canShare&&typeof File==='function'){
      var file=new File([blob],name,{type:type});
      if(navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){});return;}
    }
  }catch(e){}
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
}

/* ---------- weight ---------- */
function weightSeries(){
  var pts=[],ema=null;
  Object.keys(store).sort().forEach(function(k){
    var w=parseFloat(store[k].weight);
    if(isFinite(w)&&w>0){ema=ema===null?w:ema+0.1*(w-ema);pts.push({d:k,w:w,t:ema});}
  });
  return pts;
}
function rangePts(){
  var pts=weightSeries();
  if(wrange==='all')return pts;
  var from=addDays(todayIso(),wrange==='4w'?-28:-84);
  return pts.filter(function(p){return p.d>=from;});
}
function drawWeight(){
  var c=$('#wc');if(!c)return;
  var pts=rangePts(),W=c.clientWidth||320,H=150,dpr=window.devicePixelRatio||1;
  c.width=W*dpr;c.height=H*dpr;
  var x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  x.font='11px monospace';
  if(pts.length<2){x.fillStyle='#8da0c0';x.font='13px sans-serif';x.fillText('Weigh in on two or more days to see a trend.',8,H/2);return;}
  var lo=Infinity,hi=-Infinity;
  pts.forEach(function(p){lo=Math.min(lo,p.w,p.t);hi=Math.max(hi,p.w,p.t);});
  var pd=(hi-lo)*0.15||0.5;lo-=pd;hi+=pd;
  var t0=parse(pts[0].d).getTime(),span=Math.max(parse(pts[pts.length-1].d).getTime()-t0,1);
  function X(d){return 36+(parse(d).getTime()-t0)/span*(W-46);}
  function Y(v){return H-22-(v-lo)/(hi-lo)*(H-34);}
  x.strokeStyle='#26334f';x.fillStyle='#8da0c0';x.lineWidth=1;
  for(var g=0;g<3;g++){var v=lo+(hi-lo)*g/2,y=Y(v);x.beginPath();x.moveTo(34,y);x.lineTo(W-6,y);x.stroke();x.fillText(v.toFixed(1),0,y+4);}
  x.fillText(dayLabel(pts[0].d),34,H-6);
  var lastL=dayLabel(pts[pts.length-1].d);x.fillText(lastL,W-6-x.measureText(lastL).width,H-6);
  x.strokeStyle='#00d4aa';x.lineWidth=2.5;x.beginPath();
  pts.forEach(function(p,i){if(i)x.lineTo(X(p.d),Y(p.t));else x.moveTo(X(p.d),Y(p.t));});x.stroke();
  x.fillStyle='#a78bfa';
  pts.forEach(function(p){x.beginPath();x.arc(X(p.d),Y(p.w),3,0,6.3);x.fill();});
}
function parseWeight(s){
  s=String(s).trim().toLowerCase();
  var m=/^(\d+(?:\.\d+)?)\s*(kg|lb|lbs)?$/.exec(s);if(!m)return null;
  var v=parseFloat(m[1]);if(m[2]==='lb'||m[2]==='lbs')v=v/2.20462;
  if(v<30||v>250)return null;
  return v.toFixed(1);
}
function weightStats(){
  var all=weightSeries(),pts=rangePts(),o={n:all.length};
  if(!all.length)return o;
  var last=all[all.length-1];
  o.latest=last.w;o.trend=last.t;o.latestDate=last.d;
  if(pts.length>=2){
    var a=pts[0],b=pts[pts.length-1];
    o.change=b.t-a.t;
    var days=(parse(b.d).getTime()-parse(a.d).getTime())/86400000;
    o.days=days;
    if(days>=14){o.rate=(b.t-a.t)/(days/7);o.proj=b.t+o.rate*(30/7);}
  }
  return o;
}

/* ---------- presets ---------- */
function loadCustom(){
  var a=lsGet(K_PRE,[]);
  if(!Array.isArray(a))return[];
  return a.filter(function(p){return p&&typeof p.id==='string'&&typeof p.name==='string'&&Array.isArray(p.components)&&p.components.length&&p.components.every(function(c){return c&&c.per&&isFinite(parseFloat(c.per.kcal))&&isFinite(parseFloat(c.qty));});});
}
function saveCustom(a){if(!lsSet(K_PRE,a))toast('Could not save preset');}
function allPresets(){return BUILTIN.concat(loadCustom());}
function findPreset(id){var a=allPresets();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function loadUse(){var u=lsGet(K_USE,{});return u&&typeof u==='object'?u:{};}
function bumpUse(id){var u=loadUse();u[id]=(u[id]||0)+1;lsSet(K_USE,u);}
function qtyOf(p,i){var q=pq[p.id];return q&&q[i]!==undefined?q[i]:p.components[i].qty;}
function presetTotals(p,qs){
  var t={kcal:0,protein:0,fat:0,carbs:0,fibre:0,satfat:0,sugar:0},ex={fibre:true,satfat:true,sugar:true};
  p.components.forEach(function(c,i){
    var q=qs&&qs[i]!==undefined?qs[i]:c.qty;
    ['kcal','protein','fat','carbs'].forEach(function(k){t[k]+=(parseFloat(c.per[k])||0)*q;});
    ['fibre','satfat','sugar'].forEach(function(k){if(c.per[k]===undefined||c.per[k]===null)ex[k]=false;else t[k]+=parseFloat(c.per[k])*q;});
  });
  ['fibre','satfat','sugar'].forEach(function(k){if(!ex[k])delete t[k];});
  return t;
}
function itemFromTotals(name,t){
  var it={id:uid(),name:cleanName(name),kcal:Math.round(t.kcal),protein:r1(t.protein),fat:r1(t.fat),carbs:r1(t.carbs),time:nowHM()};
  ['fibre','satfat','sugar'].forEach(function(k){if(t[k]!==undefined)it[k]=r1(t[k]);});
  return it;
}

function bar(label,val,tgt,unit,mode,note){
  var p=tgt>0?Math.min(100,val/tgt*100):0,col='var(--teal)';
  if(mode==='limit'&&val>tgt)col='var(--red)';
  else if(mode==='kcal'&&val>tgt*1.1)col='var(--amber)';
  return '<div class="bar"><div class="bt"><span>'+label+'</span><span class="mono">'+fmt(val)+' / '+fmt(tgt)+unit+'</span></div><div class="bg"><i style="width:'+p+'%;background:'+col+'"></i></div>'+(note?'<div class="note">'+esc(note)+'</div>':'')+'</div>';
}
function cover(n,known,what){return n>0&&known<n?known+' of '+n+' entries have '+what+' data':'';}

/* ---------- suggestions ---------- */
function sugFor(q,slot){
  q=q.trim().toLowerCase();
  var out=[],seen={};
  function add(x){var k=x.name.toLowerCase();if(!seen[k]){seen[k]=1;out.push(x);}}
  if(!q){
    COMMON.filter(function(c){return c.slots.indexOf(slot)>=0;}).forEach(add);
    return out.slice(0,8);
  }
  var words=q.split(/\s+/);
  var pool=loadHist().concat(COMMON,FOODS);
  var hits=[];
  pool.forEach(function(x){
    var n=x.name.toLowerCase();
    if(words.every(function(w){return n.indexOf(w)>=0;})){
      var rank=n.indexOf(q)===0?0:(n.indexOf(' '+words[0])>=0?1:2);
      hits.push({x:x,r:rank,i:hits.length});
    }
  });
  hits.sort(function(a,b){return a.r-b.r||a.i-b.i;});
  hits.forEach(function(h){add(h.x);});
  return out.slice(0,8);
}
function updateSug(){
  var box=$('#sug');if(!box||!panel)return;
  var q=($('#pf_name')||{}).value||'';
  sugList=sugFor(q,panel.slot);

  }).join('');
}

/* ---------- barcode scanner ---------- */
function eanOk(c){
  c=String(c||'');
  if(!/^\d+$/.test(c)||[8,12,13].indexOf(c.length)<0)return false;
  var s=0,n=c.length;
  for(var i=0;i<n-1;i++){s+=(+c.charAt(n-2-i))*(i%2===0?3:1);}
  return (10-(s%10))%10===+c.charAt(n-1);
}
function productFromJson(j){
  if(!j||j.status!==1||!j.product)return{err:'notfound'};
  var p=j.product,n=p.nutriments||{};
  var kcal=num(n['energy-kcal_100g']);
  if(kcal===undefined){var kj=num(n['energy_100g']);if(kj!==undefined)kcal=kj/4.184;}
  if(kcal===undefined)return{err:'nocal'};
  var brand=String(p.brands||'').split(',')[0];
  var name=cleanName((p.product_name||'')+(brand?' ('+brand.trim()+')':''))||'Scanned product';
  var per={kcal:kcal,protein:num(n.proteins_100g),fat:num(n.fat_100g),carbs:num(n.carbohydrates_100g),fibre:num(n.fiber_100g),satfat:num(n['saturated-fat_100g']),sugar:num(n.sugars_100g)};
  var sv=num(p.serving_quantity);
  return{name:name,per:per,g:(sv&&sv>0&&sv<=2000)?sv:100,missing:per.protein===undefined||per.fat===undefined||per.carbs===undefined};
}
function scanTotals(r,g){
  var k=g/100,per=r.per,it={kcal:per.kcal*k,protein:(per.protein||0)*k,fat:(per.fat||0)*k,carbs:(per.carbs||0)*k};
  ['fibre','satfat','sugar'].forEach(function(f){if(per[f]!==undefined)it[f]=per[f]*k;});
  return it;
}

  }else if(scan.mode==='busy'){

      (r.missing?'<div class="note">Some values are missing for this product. Missing protein, fat or carbs are saved as 0. Missing fibre, sat fat or sugars are left blank.</div>':'')+

function loadQuagga(cb,fail){
  if(window.Quagga){cb();return;}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js';
  s.onload=function(){window.Quagga?cb():fail();};
  s.onerror=fail;
  document.head.appendChild(s);
}
function stopQuagga(){try{if(window.Quagga){window.Quagga.offDetected();window.Quagga.stop();}}catch(e){}}
function scanFail(msg){scan.mode='msg';scan.msg=msg;scanDraw();}
function startQuagga(){
  if(!scan.on||scan.mode!=='cam')return;
  var Q=window.Quagga;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanFail('Camera is not available here. Type the barcode number instead.');return;}
  Q.init({
    inputStream:{name:'Live',type:'LiveStream',target:$('#scan_vp'),constraints:{width:{ideal:1280},height:{ideal:720},facingMode:'environment'}},
    locator:{patchSize:'medium',halfSample:true},numOfWorkers:0,frequency:10,
    decoder:{readers:['ean_reader','ean_8_reader','upc_reader','upc_e_reader']},locate:true
  },function(err){
    if(!scan.on)return;
    if(err){
      var m=(err&&err.name==='NotAllowedError')?'Camera access was denied. Allow camera access for this site in your browser settings, or type the number instead.':'Could not start the camera. Type the barcode number instead.';
      scanFail(m);return;
    }
    Q.start();
    var m=$('#scan_msg');if(m)m.textContent='Point the camera at the barcode.';
  });
  Q.offDetected();
  Q.onDetected(function(res){
    var code=res&&res.codeResult&&res.codeResult.code;
    if(!scan.on||scan.mode!=='cam'||!eanOk(code))return;
    if(code===scan.lastCode)scan.hits++;else{scan.lastCode=code;scan.hits=1;}
    if(scan.hits>=2){stopQuagga();lookupBarcode(code);}
  });
}
var scanToken=0;
function lookupBarcode(code){
  var tok=++scanToken;
  scan.mode='busy';scan.msg='Looking up '+code+'...';scanDraw();
  var ctl=typeof AbortController==='function'?new AbortController():null;
  var timer=setTimeout(function(){if(ctl)ctl.abort();},12000);
  fetch('https://world.openfoodfacts.org/api/v0/product/'+encodeURIComponent(code)+'.json',ctl?{signal:ctl.signal}:{})
    .then(function(r){if(!r.ok)throw new Error('http');return r.json();})
    .then(function(j){
      clearTimeout(timer);if(tok!==scanToken||!scan.on)return;
      var p=productFromJson(j);
      if(p.err==='notfound'){scanFail('That product is not in Open Food Facts. Enter it by hand instead.');return;}
      if(p.err==='nocal'){scanFail('That product has no calorie data. Enter it by hand instead.');return;}
      scan.res=p;scan.mode='res';scanDraw();
    })
    .catch(function(){clearTimeout(timer);if(tok!==scanToken||!scan.on)return;scanFail('Could not reach Open Food Facts. Check your connection, or enter the food by hand.');});
}
function scanStart(){
  scan.mode='cam';scan.msg='Starting camera...';scan.res=null;scan.lastCode='';scan.hits=0;scanDraw();
  loadQuagga(startQuagga,function(){scanFail('The scanner could not load. Check your connection, or type the barcode number.');});
}
function scanShutdown(){scanToken++;stopQuagga();scan.on=false;scan.res=null;scanDraw();}

    var it=findItem(ds.s,ds.id);if(!it)return;
    panel=emptyPanel(ds.s,it.id);
    var f=panel.f;f.name=it.name;f.kcal=String(r1(it.kcal));f.protein=String(r1(it.protein));f.fat=String(r1(it.fat));f.carbs=String(r1(it.carbs));
    ['fibre','satfat','sugar'].forEach(function(k){f[k]=it[k]===undefined?'':String(r1(it[k]));});
    render();
  },
  pick:function(ds){
    var s=sugList[+ds.i];if(!s||!panel)return;
    panel.base=s;panel.sugOpen=false;applyBase();$('#sug').innerHTML='';
  },
  cancelItem:function(){panel=null;render();},
  saveItem:function(){
    if(!panel)return;
    var f=panel.f,name=cleanName(f.name),kcal=num(f.kcal);
    if(!name){toast('Add a name');return;}
    if(kcal===undefined){toast('Add calories');return;}
    if(kcal>5000){toast('Calories look too high. Check the number.');return;}
    var it={id:panel.id||uid(),name:name,kcal:kcal,protein:num(f.protein)||0,fat:num(f.fat)||0,carbs:num(f.carbs)||0};
    ['fibre','satfat','sugar'].forEach(function(k){var v=num(f[k]);if(v!==undefined)it[k]=v;});
    var d=getDay(viewDate),arr=d.meals[panel.slot],done=false;
    if(panel.id){for(var i=0;i<arr.length;i++)if(arr[i].id===panel.id){it.time=arr[i].time;arr[i]=it;done=true;}}
    if(!done){it.time=nowHM();arr.push(it);}
    addHist(it);save();panel=null;render();toast('Saved',2000);
  },
  delItem:function(ds){
    if(!window.confirm('Delete this entry?'))return;
    var d=getDay(viewDate);d.meals[ds.s]=d.meals[ds.s].filter(function(x){return x.id!==ds.id;});
    if(panel&&panel.id===ds.id)panel=null;
    save();render();
  },
  fluidKind:function(ds){fluidKind=ds.k;render();},
  addFluid:function(ds){
    var ml=cfg.cont[ds.c];if(!ml)return;
    getDay(viewDate).fluids.push({id:uid(),t:nowHM(),ml:ml,kind:fluidKind,cont:ds.c});
    save();render();
    toast('Added '+ml+' ml',2200);
  },
  addFluidCustom:function(){
    var e=$('#fcustom'),ml=num(e&&e.value);
    if(!ml||ml<1||ml>3000){toast('Enter an amount in ml (1 to 3000)');return;}
    getDay(viewDate).fluids.push({id:uid(),t:nowHM(),ml:ml,kind:fluidKind,cont:'custom'});
    save();render();
  },
  delFluid:function(ds){var d=getDay(viewDate);d.fluids=d.fluids.filter(function(x){return x.id!==ds.id;});save();render();},
  saveWeight:function(ds){
    var date=ds.d==='today'?todayIso():viewDate;
    var v=($('#wt').value||'').trim(),d=getDay(date);
    if(v===''){d.weight='';save();render();toast('Weight cleared');return;}
    var w=parseWeight(v);
    if(!w){toast('Enter kg like 84.5, or pounds like 186lb');return;}
    d.weight=w;save();render();toast('Saved '+w+' kg');
  },
  exportCSV:function(){
    var mon=(tab==='week')?weekStart:mondayOf(viewDate);
    download('nutrilog-week-'+mon+'.csv',buildCSV(mon),'text/csv');
    toast('CSV ready');
  },
  saveSettings:function(){
    var bad=false;
    Object.keys(DEFAULT_TARGETS).forEach(function(k){var v=parseFloat($('#s_'+k).value);if(isFinite(v)&&v>0)cfg.targets[k]=v;else bad=true;});
    Object.keys(DEFAULT_CONT).forEach(function(k){var v=parseFloat($('#c_'+k).value);if(isFinite(v)&&v>0)cfg.cont[k]=v;else bad=true;});
    saveCfg();render();toast(bad?'Saved. Some blank or invalid values were kept as before.':'Settings saved');
  },
  copyPrompt:function(){
    var done=function(){toast('Copied. Paste it into Claude.');};
    function fallback(){var t=$('#chatprompt');if(!t)return;t.select();try{document.execCommand('copy');done();}catch(e){toast('Press and hold the text to copy it');}}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(CHAT_PROMPT).then(done,fallback);}else fallback();
  },
  backup:function(){
    download('nutrilog-backup-'+todayIso()+'.json',JSON.stringify({app:'nutrilog',version:11,days:store,settings:cfg,history:loadHist(),presets:loadCustom()}),'application/json');
    toast('Backup ready');
  },
  restoreOpen:function(){$('#rf').click();},
  importOpen:function(){importOpen=true;importErrs=[];render();var e=$('#imp_text');if(e)e.focus();},
  importCancel:function(){importOpen=false;importText='';importErrs=[];render();},
  importRun:function(){
    var r=parseImport(importText,viewDate);
    if(r.errors.length){importErrs=r.errors.slice(0,8);render();return;}
    if(!r.ok.length){importErrs=['Nothing to add. Paste at least one line.'];render();return;}
    var added=0,dup=0;
    r.ok.forEach(function(x){
      var arr=getDay(x.date).meals[x.slot];
      var same=arr.some(function(y){return y.name.toLowerCase()===x.it.name.toLowerCase()&&Math.round(y.kcal)===Math.round(x.it.kcal);});
      if(same){dup++;return;}
      arr.push(x.it);addHist(x.it);added++;
    });
    save();importOpen=false;importText='';importErrs=[];render();
    toast('Added '+added+(dup?', skipped '+dup+' already logged':''),3000);
  },
  labelToggle:function(){if(!panel)return;panel.lbl=!panel.lbl;render();},
  labelCalc:function(){
    if(!panel)return;
    var l=panel.l,kc=num(l.kcal),g=num(l.g);
    if(kc===undefined||!g){toast('Enter kcal per 100g and the amount you had');return;}
    var k=g/100;
    function put(id,v,round){$('#pf_'+id).value=v===undefined?'':String(round?Math.round(v*k):r1(v*k));}
    put('kcal',kc,true);
    ['protein','fat','carbs','fibre','satfat','sugar'].forEach(function(f){put(f,num(l[f]),false);});
    panel.base=null;
    toast('Worked out for '+fmt(g)+' g or ml. Check and save.');
  },
  /* presets */
  pexpand:function(ds){
    if(pexp===ds.id){pexp=null;delete pq[ds.id];}
    else{var p=findPreset(ds.id);if(!p)return;pexp=ds.id;pq[ds.id]={};pslot=slotFor(p.category);}
    render();
  },
  pstep:function(ds){
    var p=findPreset(ds.id);if(!p)return;
    var i=+ds.i,c=p.components[i];if(!c)return;
    var q=qtyOf(p,i)+(+ds.d)*(c.step||1);
    q=Math.max(0,Math.round(q*100)/100);
    pq[p.id]=pq[p.id]||{};pq[p.id][i]=q;render();
  },
  plog:function(ds){var p=findPreset(ds.id);if(p)logPreset(p,slotFor(p.category),null);},
  plogx:function(ds){var p=findPreset(ds.id);if(p)logPreset(p,pslot,pq[p.id]||null);},
  pdel:function(ds){
    if(!window.confirm('Delete this preset?'))return;
    saveCustom(loadCustom().filter(function(p){return p.id!==ds.id;}));
    pexp=null;delete pq[ds.id];render();
  },
  cfOpen:function(){cfOpen=true;cform=emptyCform();render();var e=$('#cp_name');if(e)e.focus();},
  cfClose:function(){cfOpen=false;render();},
  cfSave:function(){
    var name=cleanName(cform.name),kcal=num(cform.kcal);
    if(!name){toast('Add a name');return;}
    if(kcal===undefined||kcal>5000){toast('Add calories (up to 5000)');return;}
    var per={kcal:kcal,protein:num(cform.protein)||0,fat:num(cform.fat)||0,carbs:num(cform.carbs)||0};
    ['fibre','satfat','sugar'].forEach(function(k){var v=num(cform[k]);if(v!==undefined)per[k]=v;});
    var a=loadCustom();
    a.push({id:'c'+uid(),name:name,category:slotFor(cform.cat),custom:true,components:[{name:'Serving',qty:1,unit:'serving',step:0.5,per:per}]});
    saveCustom(a);cfOpen=false;cform=emptyCform();render();toast('Preset saved');
  },
  bamOpen:function(){bam.open=true;bam.slot=slotByHour();render();var e=$('#bm_q');if(e)e.focus();},
  bamClose:function(){bamClear();render();},
  bamAdd:function(ds){
    var i=+ds.i;if(!FOODS[i])return;
    var ex=bam.items.filter(function(x){return x.i===i;})[0];
    if(ex)ex.n+=1;else bam.items.push({i:i,n:1});
    bam.q='';render();
  },
  bamStep:function(ds){
    var x=bam.items[+ds.k];if(!x)return;
    x.n=Math.round((x.n+(+ds.d)*0.5)*100)/100;
    if(x.n<=0)bam.items.splice(+ds.k,1);
    render();
  },
  bamLog:function(){
    if(!bam.items.length)return;
    var t=bamTotals(),name=bam.name.trim()||bam.items.map(function(x){return FOODS[x.i].name.split(',')[0];}).join(', ');
    var it=itemFromTotals(name,t);
    logItem(bam.slot,it);
    var sl=bam.slot;bamClear();render();toast('Added to '+slotLabel(sl)+', '+dayLabel(viewDate));
  },
  bamSave:function(){
    var name=cleanName(bam.name);
    if(!name){toast('Give the meal a name first');return;}
    if(!bam.items.length)return;
    var a=loadCustom();
    a.push({id:'c'+uid(),name:name,category:slotFor(bam.slot),custom:true,components:bam.items.map(function(x){
      var f=FOODS[x.i];return{name:f.name,qty:x.n,unit:'portion',step:0.5,per:{kcal:f.kcal,protein:f.protein,fat:f.fat,carbs:f.carbs,fibre:f.fibre,satfat:f.satfat,sugar:f.sugar}};
    })});
    saveCustom(a);bamClear();render();toast('Saved as preset');
  },
  /* scanner */
  scanOpen:function(){
    scan={on:true,mode:'cam',msg:'',res:null,lastCode:'',hits:0,slot:panel?panel.slot:slotByHour()};
    scanStart();
  },
  scanClose:function(){scanShutdown();},
  scanAgain:function(){stopQuagga();scanToken++;scanStart();},
  scanManual:function(){
    var e=$('#sc_code'),code=((e&&e.value)||'').replace(/\s/g,'');
    if(!/^\d{8,14}$/.test(code)){toast('Type the 8 to 14 digit number under the barcode');return;}
    stopQuagga();lookupBarcode(code);
  },
  scanAdd:function(){
    var r=scan.res;if(!r)return;
    var g=r.g;
    if(!isFinite(g)||g<=0||g>5000){toast('Enter the grams or ml you had (1 to 5000)');return;}
    var it=itemFromTotals(r.name.slice(0,60)+' '+fmt(g)+'g',scanTotals(r,g));
    if(!(it.kcal<=5000)){toast('Calories look too high. Check the amount.');return;}
    var slot=scan.slot;
    logItem(slot,it);
    scanShutdown();panel=null;render();toast('Added to '+slotLabel(slot)+', '+dayLabel(viewDate));
  }
};
function run(act,ds){
  if(!ACT[act])return;
  syncForms();
  ACT[act](ds||{});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  run(el.dataset.act,el.dataset);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();run(e.target.dataset.enter,e.target.dataset);}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='pf_name'&&panel){panel.sugOpen=true;updateSug();}
  else if(t.id==='pf_mult'&&panel&&panel.base){applyBase();}
  else if(t.dataset&&t.dataset.nut&&panel){panel.base=null;}
  else if(t.id==='bm_q'){bam.q=t.value;updateBamSug();}
  else if(t.id==='sc_g'&&scan.res){
    var g=parseFloat(t.value),box=$('#sc_tot');
    if(box&&isFinite(g)&&g>0)box.textContent=totalsLine(scanTotals(scan.res,g));
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='jdate'){
    var v=e.target.value;
    if(validDate(v)&&v<=todayIso()){syncForms();viewDate=v;panel=null;jform=newJ();render();}
    return;
  }
  if(e.target.id!=='rf')return;
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var b=JSON.parse(fr.result);
      if(!b||b.app!=='nutrilog'||!b.days||typeof b.days!=='object')throw new Error('bad');
      if(!window.confirm('Replace everything on this phone with this backup?'))return;
      var nd={};Object.keys(b.days).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k))nd[k]=norm(b.days[k],k);});
      store=nd;save();
      if(b.settings&&typeof b.settings==='object'){lsSet(K_CFG,b.settings);loadCfg();}
      if(Array.isArray(b.history))lsSet(K_HIST,b.history.slice(0,150));
      if(Array.isArray(b.presets))lsSet(K_PRE,b.presets.slice(0,200));
      panel=null;pexp=null;render();toast('Backup restored');
    }catch(err){toast('That file is not a NutriLog backup');}
  };
  fr.readAsText(file);e.target.value='';
});

/* ---------- clock: midnight rollover ---------- */
function tick(){
  try{
    var t=todayIso();
    if(t===lastToday)return;
    if(viewDate===lastToday)viewDate=t;
    if(weekStart===mondayOf(lastToday))weekStart=mondayOf(t);
    lastToday=t;
    var a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    if(!panel&&!typing&&!scan.on&&!importOpen&&!cfOpen&&!bam.open)render();
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
setInterval(tick,60000);

/* ---------- start ---------- */
loadCfg();loadStore();
render();
window.NL={parseImport:parseImport,buildCSV:buildCSV,totals:totals,peek:peek,store:function(){return store;},cfg:function(){return cfg;},
  parseWeight:parseWeight,gutSummary:gutSummary,tick:tick,mondayOf:mondayOf,addDays:addDays,sugFor:sugFor,streakInfo:streakInfo,dayTargets:dayTargets,
  presetTotals:presetTotals,allPresets:allPresets,productFromJson:productFromJson,eanOk:eanOk,weightStats:weightStats,weightSeries:weightSeries,
  setView:function(d){viewDate=d;render();},state:function(){return{tab:tab,viewDate:viewDate,weekStart:weekStart};},FOODS:FOODS,COMMON:COMMON,BUILTIN:BUILTIN,cleanName:cleanName};
})();
</script>
